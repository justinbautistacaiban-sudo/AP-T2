
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AP Project</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;

            background-color: rgb(22, 104, 131);
            font-family: Arial, sans-serif;
        }

        .box {
            width: 500px;
            max-width: calc(100% - 32px);

            background-color: rgb(87, 174, 228);
            border-radius: 20px;
            margin: 40px auto;
            padding: 20px;

            transition: box-shadow 0.3s ease;
        }

        .box:hover {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .member {
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .member:hover {
            color: white;
            text-decoration: underline;
        }

        #preview {
            display: block;
            width: 100%;
            max-width: 350px;
            height: auto;
            margin: 20px auto 0;
            border-radius: 15px;

            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;

            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
        }

        #preview.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Adjust spacing on small screens */
        @media (max-width: 480px) {
            .box {
                margin: 20px auto;
                padding: 16px;
                border-radius: 16px;
            }

            h1 {
                font-size: 26px;
            }

            .members-list {
                line-height: 1.8;
            }
        }
    </style>
</head>

<body>

    <div class="box" id="projectBox">

        <h1>AP Project</h1>

        <p>Members:</p>

        <p class="members-list">
            <span class="member"
                data-image="hildane.jpg"
                data-name="Hildane Barrios">
                Barrios, Hildane
            </span>
            (Concept maker)<br>

            <span class="member"
                data-image="justin.jpg"
                data-name="Justin Caiban">
                Caiban, Justin
            </span>
            (Website creator and assistant Designer of Poster)<br>

            <span class="member"
                data-image="peter.jpg"
                data-name="Peter Torio">
                Torio, Peter
            </span>
            (Lead Designer of Poster)<br>

            <span class="member"
                data-image="alexine.jpg"
                data-name="Alexine Binag">
                Binag, Alexine
            </span>
            (Leader)<br>

            <span class="member"
                data-image="cherina.jpg"
                data-name="Cherina Conejo">
                Conejo, Cherina
            </span>
            (Concept maker)
        </p>

        <img id="preview" src="" alt="Project preview">

    </div>

    <script>
        const box = document.getElementById("projectBox");
        const preview = document.getElementById("preview");

        const poster = "poster.jpg";

        function showImage(src, name) {
            if (preview.getAttribute("src") !== src) {
                preview.src = src;
            }

            preview.alt = name;
            preview.classList.add("visible");
        }

        function hideImage() {
            preview.classList.remove("visible");
        }

        function showMemberOrPoster(target) {
            const member = target.closest(".member");

            if (member && box.contains(member)) {
                showImage(
                    member.dataset.image,
                    member.dataset.name
                );
            } else {
                showImage(poster, "AP Project poster");
            }
        }

        // DESKTOP: Only use hover behavior when a mouse is available.
        const hasMouseHover = window.matchMedia(
            "(hover: hover) and (pointer: fine)"
        );

        function enableMouseBehavior() {
            box.addEventListener("mouseenter", handleMouseEnter);
            box.addEventListener("mousemove", handleMouseMove);
            box.addEventListener("mouseleave", handleMouseLeave);
        }

        function handleMouseEnter() {
            showImage(poster, "AP Project poster");
        }

        function handleMouseMove(event) {
            showMemberOrPoster(event.target);
        }

        function handleMouseLeave() {
            hideImage();
        }

        if (hasMouseHover.matches) {
            enableMouseBehavior();
        }

        // MOBILE AND DESKTOP: Tapping/clicking also works.
        box.addEventListener("click", (event) => {
            showMemberOrPoster(event.target);
        });
    </script>

</body>
</html>
