
<!DOCTYPE html>
<html>
<head>
    <title>AP Project</title>

    <style>
        body {
            min-height: 100vh;
            background-color: rgb(22, 104, 131);
            font-family: Arial, sans-serif;
        }

        .box {
            width: 500px;
            max-width: 80%;
            background-color: rgb(87, 174, 228);
            border-radius: 20px;
            margin: 100px auto;
            padding: 20px;
            transition: 0.3s ease;
        }

        .box:hover {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .member {
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .member:hover {
            color: white;
            text-decoration: underline;
        }

        #preview {
            display: block;
            width: 100%;
            max-width: 350px;
            margin: 20px auto 0;
            border-radius: 15px;

            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
            transition: opacity 0.3s ease,
                        transform 0.3s ease;
        }

        #preview.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

<body>

    <div class="box" id="projectBox">

        <h1>AP Project</h1>

        <p>Members:</p>

        <p>
            <span class="member"
                data-image="hildane.jpg"
                data-name="Hildane Barrios">
                Barrios, Hildane
            </span>
            (Concept maker)<br>

            <span class="member"
                data-image="justin.jpg"
                data-name="Justin Caiban">
                Caiban, Justin
            </span>
            (Website creator and assistant Designer of Poster)<br>

            <span class="member"
                data-image="peter.jpg"
                data-name="Peter Torio">
                Torio, Peter
            </span>
            (Lead Designer of Poster)<br>

            <span class="member"
                data-image="alexine.jpg"
                data-name="Alexine Binag">
                Binag, Alexine
            </span>
            (Leader)<br>

            <span class="member"
                data-image="cherina.jpg"
                data-name="Cherina Conejo">
                Conejo, Cherina
            </span>
            (Concept maker)
        </p>

        <img id="preview" src="" alt="Project preview">

    </div>

    <script>
        const box = document.getElementById("projectBox");
        const preview = document.getElementById("preview");

        const poster = "poster.jpg";

        function showImage(src, name) {
            if (preview.getAttribute("src") !== src) {
                preview.src = src;
            }

            preview.alt = name;
            preview.classList.add("visible");
        }

        function hideImage() {
            preview.classList.remove("visible");
        }

        // Hover over the box to show the poster
        box.addEventListener("mouseenter", () => {
            showImage(poster, "AP Project poster");
        });

        // Detect whether the mouse is over a member's name
        box.addEventListener("mousemove", (event) => {
            const member = event.target.closest(".member");

            if (member && box.contains(member)) {
                showImage(
                    member.dataset.image,
                    member.dataset.name
                );
            } else {
                showImage(poster, "AP Project poster");
            }
        });

        // Hide the image when leaving the entire box
        box.addEventListener("mouseleave", () => {
            hideImage();
        });
    </script>

</body>
</html>
